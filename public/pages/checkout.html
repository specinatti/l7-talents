<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - L7 Talents</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--cream); }
    .checkout-wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 28px; }
    @media(max-width:700px){ .checkout-wrap { grid-template-columns: 1fr; } }
    .summary-card { background: var(--cream2); border-radius: 14px; padding: 28px; height: fit-content; position: sticky; top: 80px; }
    .summary-card h2 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--navy); margin-bottom: 20px; }
    .summary-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--cream); font-size: 14px; color: var(--navy); }
    .summary-total { display: flex; justify-content: space-between; padding: 16px 0 0; font-size: 20px; font-weight: 700; color: var(--navy); }
    .payment-card { background: var(--cream2); border-radius: 14px; padding: 28px; }
    .payment-card h2 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--navy); margin-bottom: 8px; }
    .payment-card p { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
    .form-input { width: 100%; padding: 11px 14px; border: 1px solid rgba(27,42,74,.2); border-radius: 8px; font-size: 14px; background: var(--cream); color: var(--navy); margin-bottom: 14px; }
    .form-input:focus { outline: none; border-color: var(--rose); }
    .form-label { font-size: 13px; font-weight: 500; color: var(--navy); display: block; margin-bottom: 6px; }
    #payment-brick-container { min-height: 200px; }
    .security-badges { display: flex; gap: 16px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    .badge-sec { font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 4px; }
    #step-dados { }
    #step-pagamento { display: none; }
    .btn-continuar { width: 100%; padding: 14px; background: var(--navy); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 4px; }
    .btn-continuar:hover { background: var(--rose); }
    #alert { display: none; background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><img src="/images/l7-logo.svg" alt="L7 Talents" style="height:40px;object-fit:contain;"></a>
    <a href="/pages/planos.html" style="font-size:14px;color:var(--navy);">← Voltar aos planos</a>
  </nav>

  <div class="checkout-wrap">
    <!-- Resumo -->
    <div class="summary-card">
      <h2>Resumo do pedido</h2>
      <div class="summary-item"><span id="s-nome">—</span><span id="s-valor">—</span></div>
      <div class="summary-item" style="color:#6b7280;font-size:13px;"><span id="s-desc">—</span></div>
      <div class="summary-total"><span>Total</span><span id="s-total" style="color:var(--rose);">—</span></div>
      <div style="margin-top:20px;padding:14px;background:var(--cream);border-radius:8px;">
        <div style="font-size:12px;color:#6b7280;margin-bottom:8px;font-weight:600;">FORMAS DE PAGAMENTO</div>
        <div style="font-size:13px;color:var(--navy);display:flex;flex-direction:column;gap:6px;">
          <span>💳 Cartão de crédito (até 12x)</span>
          <span>📱 Pix (aprovação imediata)</span>
          <span>📄 Boleto bancário</span>
        </div>
      </div>
    </div>

    <!-- Pagamento -->
    <div class="payment-card">
      <h2>Finalizar contratação</h2>
      <p>Pagamento seguro processado pelo Mercado Pago</p>
      <div id="alert"></div>

      <!-- Passo 1: dados do comprador -->
      <div id="step-dados">
        <label class="form-label">Nome completo *</label>
        <input type="text" id="nome" class="form-input" placeholder="Seu nome" required>
        <label class="form-label">E-mail *</label>
        <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
        <label class="form-label">Empresa</label>
        <input type="text" id="empresa" class="form-input" placeholder="Nome da empresa (opcional)">
        <button class="btn-continuar" onclick="continuar()">Continuar para pagamento →</button>
      </div>

      <!-- Passo 2: brick de pagamento -->
      <div id="step-pagamento">
        <div id="payment-brick-container"></div>
      </div>

      <div class="security-badges">
        <div class="badge-sec">🔒 SSL 256-bit</div>
        <div class="badge-sec">🛡️ PCI DSS</div>
        <div class="badge-sec">✅ Mercado Pago</div>
      </div>
    </div>
  </div>

  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script src="/js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const pacote = params.get('pacote');
    const nomePacote = decodeURIComponent(params.get('nome') || pacote || '');
    const valor = parseFloat(params.get('valor') || 0);

    if (!pacote) location.href = '/pages/planos.html';

    // Preencher resumo
    document.getElementById('s-nome').textContent = nomePacote;
    document.getElementById('s-valor').textContent = 'R$ ' + valor.toLocaleString('pt-BR', {minimumFractionDigits:2});
    document.getElementById('s-total').textContent = 'R$ ' + valor.toLocaleString('pt-BR', {minimumFractionDigits:2});

    // Buscar descrição
    get('/pagamentos/pacotes').then(p => {
      if (p[pacote]) document.getElementById('s-desc').textContent = p[pacote].descricao;
    }).catch(()=>{});

    // Pré-preencher email se logado
    const user = auth.getUser();
    if (user) document.getElementById('email').value = user.email;

    async function continuar() {
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const empresa = document.getElementById('empresa').value.trim();
      const alertEl = document.getElementById('alert');

      if (!nome || !email) {
        alertEl.textContent = 'Nome e e-mail são obrigatórios.';
        alertEl.style.display = 'block';
        return;
      }
      alertEl.style.display = 'none';

      // Criar preferência no backend
      let prefData;
      try {
        prefData = await post('/pagamentos/preferencia', { pacote, nome, email, empresa });
      } catch(err) {
        alertEl.textContent = err.message || 'Erro ao iniciar pagamento.';
        alertEl.style.display = 'block';
        return;
      }

      // Mostrar brick
      document.getElementById('step-dados').style.display = 'none';
      document.getElementById('step-pagamento').style.display = 'block';

      const mp = new MercadoPago('APP_USR-4b125498-f97d-43d0-9979-a9fcb7db8f04', { locale: 'pt-BR' });
      const bricks = mp.bricks();

      await bricks.create('payment', 'payment-brick-container', {
        initialization: {
          amount: valor,
          preferenceId: prefData.preference_id,
        },
        customization: {
          paymentMethods: {
            creditCard: 'all',
            debitCard: 'all',
            ticket: 'all',
            bankTransfer: 'all',
            atm: 'all',
          },
          visual: {
            style: {
              theme: 'default',
              customVariables: {
                baseColor: '#1B2A4A',
                baseColorFirstVariant: '#B85C6E',
                baseColorSecondVariant: '#F2EDE8',
                fontSizeSmall: '13px',
                borderRadiusSmall: '8px',
                borderRadiusMedium: '10px',
                borderRadiusLarge: '12px',
              }
            }
          }
        },
        callbacks: {
          onReady: () => {},
          onSubmit: async ({ selectedPaymentMethod, formData }) => {
            try {
              const result = await post('/pagamentos/processar', { ...formData, pedido_id: prefData.pedido_id });
              if (result.status === 'approved') {
                location.href = '/pages/pagamento-sucesso.html';
              } else if (result.status === 'pending') {
                location.href = '/pages/pagamento-sucesso.html?status=pending';
              } else {
                location.href = '/pages/pagamento-falha.html';
              }
            } catch {
              location.href = '/pages/pagamento-falha.html';
            }
          },
          onError: (error) => {
            console.error('Brick error:', error);
          },
        },
      });
    }
  </script>
</body>
</html>
