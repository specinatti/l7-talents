<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação 2FA - L7 Talents</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background:var(--cream); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .auth-card { background:var(--cream2); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:40px; width:100%; max-width:420px; border:1px solid rgba(27,42,74,.08); }
    .code-input { font-size:28px; letter-spacing:12px; text-align:center; font-weight:700; }
  </style>
</head>
<body>
<div class="auth-card">
  <div style="text-align:center;margin-bottom:28px;">
    <img src="/images/l7-logo.svg" alt="L7 Talents" style="height:48px;">
  </div>

  <!-- Verificação no login -->
  <div id="section-verify">
    <h1 style="font-size:20px;font-weight:700;margin-bottom:6px;">Verificação em duas etapas</h1>
    <p style="color:var(--gray-500);font-size:14px;margin-bottom:24px;">Abra o Google Authenticator e insira o código de 6 dígitos.</p>
    <div id="alert-verify"></div>
    <form id="form-verify">
      <div class="form-group">
        <input type="text" id="code-verify" class="form-control code-input" maxlength="6" placeholder="000000" autocomplete="one-time-code" inputmode="numeric" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-verify">Verificar</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--gray-500);">
      <a href="/pages/login.html">← Voltar ao login</a>
    </p>
  </div>

  <!-- Setup 2FA (para usuários já logados) -->
  <div id="section-setup" class="hidden">
    <h1 style="font-size:20px;font-weight:700;margin-bottom:6px;">Configurar 2FA</h1>
    <p style="color:var(--gray-500);font-size:14px;margin-bottom:20px;">Escaneie o QR Code com o Google Authenticator ou Authy.</p>
    <div id="alert-setup"></div>
    <div id="qr-container" style="text-align:center;margin-bottom:20px;"></div>
    <div id="secret-box" style="background:var(--cream);border-radius:8px;padding:12px;text-align:center;margin-bottom:20px;font-family:monospace;font-size:14px;word-break:break-all;"></div>
    <form id="form-setup">
      <div class="form-group">
        <label class="form-label">Confirme com o código gerado</label>
        <input type="text" id="code-setup" class="form-control code-input" maxlength="6" placeholder="000000" inputmode="numeric" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-setup">Ativar 2FA</button>
    </form>
  </div>

  <!-- Desativar 2FA -->
  <div id="section-disable" class="hidden">
    <h1 style="font-size:20px;font-weight:700;margin-bottom:6px;">Desativar 2FA</h1>
    <p style="color:var(--gray-500);font-size:14px;margin-bottom:20px;">Insira o código atual para confirmar a desativação.</p>
    <div id="alert-disable"></div>
    <form id="form-disable">
      <div class="form-group">
        <input type="text" id="code-disable" class="form-control code-input" maxlength="6" placeholder="000000" inputmode="numeric" required>
      </div>
      <button type="submit" class="btn btn-secondary btn-block" id="btn-disable">Desativar 2FA</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="/js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || 'verify';

  // Dados temporários do login pendente (passados via sessionStorage)
  const pendingLogin = JSON.parse(sessionStorage.getItem('pending_2fa') || 'null');

  function show(id) {
    ['section-verify','section-setup','section-disable'].forEach(s =>
      document.getElementById(s).classList.add('hidden')
    );
    document.getElementById(id).classList.remove('hidden');
  }

  if (mode === 'setup') {
    if (!auth.isLogged()) { location.replace('/pages/login.html'); }
    show('section-setup');
    // Solicitar setup ao servidor
    post('/auth/2fa/setup', {}).then(data => {
      document.getElementById('secret-box').textContent = data.secret;
      QRCode.toCanvas(document.createElement('canvas'), data.otpauth_url, { width: 200 }, (err, canvas) => {
        if (!err) document.getElementById('qr-container').appendChild(canvas);
      });
    }).catch(err => showAlert(err.message, 'error', document.getElementById('alert-setup')));

    document.getElementById('form-setup').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-setup');
      setLoading(btn, true);
      try {
        await post('/auth/2fa/verify', { code: document.getElementById('code-setup').value });
        showAlert('2FA ativado com sucesso!', 'success', document.getElementById('alert-setup'));
        setTimeout(() => location.replace(`/pages/${auth.getUser().role}/dashboard.html`), 1500);
      } catch (err) {
        showAlert(err.message, 'error', document.getElementById('alert-setup'));
        setLoading(btn, false);
      }
    });

  } else if (mode === 'disable') {
    if (!auth.isLogged()) { location.replace('/pages/login.html'); }
    show('section-disable');

    document.getElementById('form-disable').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-disable');
      setLoading(btn, true);
      try {
        await post('/auth/2fa/disable', { code: document.getElementById('code-disable').value });
        showAlert('2FA desativado.', 'success', document.getElementById('alert-disable'));
        setTimeout(() => location.replace(`/pages/${auth.getUser().role}/dashboard.html`), 1500);
      } catch (err) {
        showAlert(err.message, 'error', document.getElementById('alert-disable'));
        setLoading(btn, false);
      }
    });

  } else {
    // mode=verify — login pendente
    if (!pendingLogin) { location.replace('/pages/login.html'); }
    show('section-verify');

    document.getElementById('form-verify').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-verify');
      setLoading(btn, true);
      try {
        const data = await post('/auth/login', {
          email: pendingLogin.email,
          password: pendingLogin.password,
          totp_code: document.getElementById('code-verify').value,
        });
        sessionStorage.removeItem('pending_2fa');
        auth.setSession(data.token, data.user);
        location.replace(`/pages/${data.user.role}/dashboard.html`);
      } catch (err) {
        showAlert(err.message, 'error', document.getElementById('alert-verify'));
        setLoading(btn, false);
      }
    });
  }
</script>
</body>
</html>
