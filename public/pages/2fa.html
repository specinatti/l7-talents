<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Acesso - L7 Talents</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background:var(--cream); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .auth-card { background:var(--cream2); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:40px; width:100%; max-width:440px; border:1px solid rgba(27,42,74,.08); }
    .code-input { font-size:28px; letter-spacing:12px; text-align:center; font-weight:700; }
  </style>
</head>
<body>
<div class="auth-card">
  <div style="text-align:center;margin-bottom:24px;">
    <img src="/images/l7-logo.svg" alt="L7 Talents" style="height:44px;">
  </div>

  <!-- ── Verificação OTP no login ── -->
  <div id="section-otp" class="hidden">
    <h1 style="font-size:20px;font-weight:700;margin-bottom:6px;">Verificação de acesso</h1>
    <p style="color:var(--gray-500);font-size:14px;margin-bottom:8px;">Um código de 6 dígitos foi enviado para o seu email.</p>
    <p id="otp-email-hint" style="color:var(--navy);font-size:13px;font-weight:600;margin-bottom:20px;"></p>
    <div id="alert-otp"></div>
    <form id="form-otp">
      <div class="form-group">
        <input type="text" id="code-otp" class="form-control code-input" maxlength="6" placeholder="000000"
               autocomplete="one-time-code" inputmode="numeric" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-otp">Verificar</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--gray-500);">
      <a href="/pages/login.html">← Voltar ao login</a>
    </p>
  </div>

  <!-- ── Gerenciar email alternativo (logado) ── -->
  <div id="section-manage" class="hidden">
    <h1 style="font-size:20px;font-weight:700;margin-bottom:6px;">Segurança da conta</h1>
    <p style="color:var(--gray-500);font-size:14px;margin-bottom:24px;">
      O código de verificação é enviado para o email principal e, se cadastrado, para o email alternativo.
    </p>
    <div id="alert-manage"></div>
    <div class="form-group">
      <label class="form-label">Email principal</label>
      <input type="email" id="email-principal" class="form-control" disabled style="background:var(--cream);color:var(--gray-500);">
    </div>
    <form id="form-alt-email">
      <div class="form-group">
        <label class="form-label">Email alternativo <span style="color:var(--gray-400);font-weight:400;">(opcional)</span></label>
        <input type="email" id="email-alternativo" class="form-control" placeholder="backup@email.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-save-email">Salvar email alternativo</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:13px;">
      <a href="javascript:history.back()">← Voltar</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || 'otp';
  const pendingLogin = JSON.parse(sessionStorage.getItem('pending_2fa') || 'null');

  function show(id) {
    ['section-otp','section-manage'].forEach(s => document.getElementById(s).classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  // ── OTP no login ──────────────────────────────────────────────────────
  if (mode === 'otp') {
    if (!pendingLogin) { location.replace('/pages/login.html'); }
    show('section-otp');

    // Mostrar hint do email mascarado
    const email = pendingLogin.email;
    const [user, domain] = email.split('@');
    const masked = user.substring(0, 2) + '***@' + domain;
    document.getElementById('otp-email-hint').textContent = masked;

    document.getElementById('form-otp').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-otp');
      setLoading(btn, true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: pendingLogin.email,
            password: pendingLogin.password,
            otp_code: document.getElementById('code-otp').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Código inválido');
        sessionStorage.removeItem('pending_2fa');
        auth.setSession(data.token, data.user);
        location.replace(`/pages/${data.user.role}/dashboard.html`);
      } catch (err) {
        showAlert(err.message, 'error', document.getElementById('alert-otp'));
        document.getElementById('code-otp').value = '';
        setLoading(btn, false);
      }
    });

  // ── Gerenciar email alternativo ───────────────────────────────────────
  } else {
    if (!auth.isLogged()) { location.replace('/pages/login.html'); }
    show('section-manage');

    get('/auth/me').then(user => {
      document.getElementById('email-principal').value = user.email;
      document.getElementById('email-alternativo').value = user.email_alternativo || '';
    }).catch(() => location.replace('/pages/login.html'));

    document.getElementById('form-alt-email').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-save-email');
      setLoading(btn, true);
      try {
        await put('/auth/email-alternativo', { email_alternativo: document.getElementById('email-alternativo').value || null });
        showAlert('Email alternativo salvo!', 'success', document.getElementById('alert-manage'));
      } catch (err) {
        showAlert(err.message, 'error', document.getElementById('alert-manage'));
      }
      setLoading(btn, false);
    });
  }
</script>
</body>
</html>
